# Envoy Gateway SecurityPolicy to enforce CORS headers at the gateway level.
#
# This ensures CORS headers are present on ALL responses, including 503 error
# responses returned by the gateway when KEDA has scaled the server to 0 replicas.
# Without this, browser requests to the API will be blocked during scale-to-zero
# periods because the 503 responses lack CORS headers (FastAPI only adds them
# for responses it actually processes).
#
# NOTE: The targetRef.name must match the HTTPRoute name generated by the Helm
# chart for the weather-map-server release (typically the Helm release name).
# Verify with: kubectl get httproutes -n weather-map
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: weather-map-server-cors
  namespace: weather-map
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: weather-map-server
  cors:
    allowOrigins:
    - type: Exact
      value: "https://weather-map.dataportal.fi"
    allowMethods:
    - GET
    - POST
    - OPTIONS
    allowHeaders:
    - DNT
    - Keep-Alive
    - User-Agent
    - X-Requested-With
    - If-Modified-Since
    - Cache-Control
    - Content-Type
    - Range
    - Authorization
    allowCredentials: true
