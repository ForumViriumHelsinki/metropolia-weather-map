image:
  repository: ghcr.io/forumviriumhelsinki/weather-map-client
  tag: "0.1.0"
imagePullSecrets:
- name: ghcr-login-secret
replicaCount: 1
serviceAccount:
  create: false
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
service:
  type: ClusterIP
  port: 3000
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
  - host: weather-map.dataportal.fi
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - hosts:
    - weather-map.dataportal.fi
    secretName: weather-map-client-tls # pragma: allowlist secret
env:
  NODE_ENV:
    value: "production"
  NEXT_PUBLIC_PYTHON_API:
    value: "https://weather-map-api.dataportal.fi"
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: Europe/Helsinki
      start: 0 7 * * 1-5
      end: 0 18 * * 1-5
      desiredReplicas: "1"
