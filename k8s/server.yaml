apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-server
  namespace: weather-map
  labels:
    app.kubernetes.io/name: weather-map
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-map
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-map
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: server
        image: weather-map-server
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: weather-map
  labels:
    app.kubernetes.io/name: weather-map
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: weather-map
    app.kubernetes.io/component: server
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP