apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-client
  namespace: metropolia-weather-map
  labels:
    app.kubernetes.io/name: metropolia-weather-map
    app.kubernetes.io/component: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metropolia-weather-map
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metropolia-weather-map
        app.kubernetes.io/component: client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: client
        image: weather-map-client
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_PYTHON_API
          value: "http://fastapi-service:8000"
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: metropolia-weather-map
  labels:
    app.kubernetes.io/name: metropolia-weather-map
    app.kubernetes.io/component: client
spec:
  selector:
    app.kubernetes.io/name: metropolia-weather-map
    app.kubernetes.io/component: client
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP