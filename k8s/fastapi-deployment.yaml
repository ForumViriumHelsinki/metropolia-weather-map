apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-server
  namespace: metropolia-weather-map
  labels:
    app: fastapi-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-server
  template:
    metadata:
      labels:
        app: fastapi-server
    spec:
      containers:
      - name: fastapi-server
        image: weather-map/fastapi-server:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: fastapi-config
              key: DB_NAME
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: fastapi-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: fastapi-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: fastapi-config
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: fastapi-secret
              key: DB_PASS
        - name: MPLCONFIGDIR
          valueFrom:
            configMapKeyRef:
              name: fastapi-config
              key: MPLCONFIGDIR
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5